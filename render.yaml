# Blueprint do Render: publica o front como site estático. Passo a passo em DEPLOY.md (projeto do backend).
services:
  - type: web
    name: chamados-front
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/chamados-frontend/browser
    routes:
      # SPA: qualquer rota (/chamados/12, /usuarios/novo...) devolve o index.html e o Angular resolve
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
