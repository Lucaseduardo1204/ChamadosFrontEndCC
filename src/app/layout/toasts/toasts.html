<div class="toasts" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="'toast-' + toast.tipo" role="status">
      <span>{{ toast.mensagem }}</span>
      <button type="button" aria-label="Fechar" (click)="toastService.remover(toast.id)">×</button>
    </div>
  }
</div>
